<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tunisie Telecom Pricing Simulator</title><style>
:root{--n:#14213d;--m:#667085;--l:#d8dee9;--p:#f4f6fa;--a:#d91b72;--g:#087443;--r:#b42318}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--p);color:var(--n)}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l);padding:14px 3%}.bar{max-width:1400px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand b{font-size:19px}.brand small{display:block;color:var(--a);font-weight:700;letter-spacing:.08em}.actions{display:flex;gap:7px;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid var(--l);border-radius:8px;padding:8px;background:#fff;color:var(--n)}button{cursor:pointer;font-weight:700}.primary{background:var(--n);color:#fff}.accent{background:var(--a);color:#fff;border-color:var(--a)}main{max-width:1400px;margin:auto;padding:24px 3% 50px}h1{font-size:32px;margin:0}.sub{color:var(--m);margin:6px 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;box-shadow:0 5px 18px #14213d0c}.label{color:var(--m);font-weight:700}.value{font-size:28px;font-weight:800;margin-top:7px}.note{color:var(--m);font-size:12px;margin-top:5px}.tabs{display:flex;gap:5px;margin:18px 0;border-bottom:1px solid var(--l)}.tab{border:0;background:none;border-radius:0;padding:11px 14px;color:var(--m)}.tab.on{color:var(--n);border-bottom:3px solid var(--a)}.panel{margin-bottom:14px}h2{font-size:18px;margin:0 0 12px}.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{display:grid;gap:5px}.field span{font-size:12px;color:var(--m);font-weight:700}.table{overflow:auto;border:1px solid var(--l);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:8px;border-bottom:1px solid #edf0f5;text-align:left}th{position:sticky;top:0;background:#f8fafc;color:var(--m);font-size:11px;text-transform:uppercase}td input,td select{width:100%;min-width:70px;padding:6px}.role{min-width:230px}.num{text-align:right}.status{display:inline-block;padding:6px 10px;border-radius:20px;font-weight:700;background:#ecfdf3;color:var(--g)}.bad{background:#fef3f2;color:var(--r)}.bars{display:grid;gap:11px}.brow{display:grid;grid-template-columns:220px 1fr 100px;gap:10px;align-items:center}.track{height:11px;background:#edf0f5;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--n),var(--a))}.right{text-align:right;font-weight:700}.scenarioCards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sc{border:1px solid var(--l);border-radius:12px;padding:14px}.sc p{display:flex;justify-content:space-between;border-top:1px solid #eee;padding-top:8px}.hide{display:none}@media(max-width:900px){.grid,.inputs,.scenarioCards{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.inputs,.scenarioCards{grid-template-columns:1fr}.brow{grid-template-columns:1fr}.right{text-align:left}}
</style></head><body><header><div class="bar"><div class="brand"><small>COMMERCIAL WORKING MODEL</small><b>Tunisie Telecom Pricing Simulator</b></div><div class="actions"><select id="scenario"></select><button id="new">New</button><button id="dup">Duplicate</button><button id="reset">Reset</button><button id="csv" class="primary">Export CSV</button></div></div></header><main><div style="display:flex;justify-content:space-between;gap:15px;align-items:start;flex-wrap:wrap"><div><h1>Pricing cockpit</h1><div class="sub">Edit staffing, rates and commercial assumptions. All results update instantly and save in your browser.</div></div><span id="status" class="status"></span></div><div id="kpis" class="grid"></div><div class="tabs"><button class="tab on" data-tab="summary">Overview</button><button class="tab" data-tab="team">Team model</button><button class="tab" data-tab="compare">Scenarios</button></div><section id="summary"></section><section id="team" class="hide"></section><section id="compare" class="hide"></section></main><script>
const $=s=>document.querySelector(s),fmt=(n,c='EUR')=>new Intl.NumberFormat('en',{style:'currency',currency:c,maximumFractionDigits:0}).format(n),uid=()=>Math.random().toString(36).slice(2),clone=o=>JSON.parse(JSON.stringify(o));
const baseRows=[['KE1','Programme Director','Key Expert','Internal',1,36,950,.2,'WS1'],['KE2','Commercial Lead','Key Expert','Internal',1,30,850,.35,'WS1'],['KE3','Pricing Expert','Key Expert','Freelance',2,18,700,1,'WS2'],['KE4','Financial Modelling Expert','Key Expert','Freelance',2,20,680,1,'WS2'],['KE5','Wholesale Strategy Expert','Key Expert','Internal',1,24,800,.4,'WS3'],['KE6','Regulatory Expert','Key Expert','Freelance',4,16,650,1,'WS3'],['ST1','Senior Consultant','Support Team','Internal',1,36,600,.65,'WS4'],['ST2','Consultant','Support Team','Internal',1,36,450,.8,'WS4'],['ST3','Data Analyst','Support Team','Freelance',3,30,400,.75,'WS5'],['ST4','PMO Analyst','Support Team','Internal',1,36,380,.6,'WS1'],['ST5','Research Analyst','Support Team','Freelance',1,24,350,.7,'WS5'],['ST6','Designer','Support Team','Freelance',5,28,420,.35,'WS5']];
const ws={WS1:'Programme governance',WS2:'Pricing & financial model',WS3:'Wholesale strategy',WS4:'Implementation support',WS5:'Analytics & deliverables'};
function factory(name='Base Case'){return{id:uid(),name,a:{target:2400000,allowance:5,days:20,currency:'EUR'},rows:baseRows.map(r=>({id:r[0],role:r[1],group:r[2],source:r[3],start:r[4],end:r[5],rate:r[6],alloc:r[7],ws:r[8]}))}}
let state;try{state=JSON.parse(localStorage.tt_pub_sim)}catch(e){}if(!state)state={active:'',scenarios:[]};if(!state.scenarios.length){let s=factory();state.scenarios=[s];state.active=s.id}const save=()=>localStorage.tt_pub_sim=JSON.stringify(state),cur=()=>state.scenarios.find(s=>s.id===state.active)||state.scenarios[0];
const days=(r,s)=>Math.max(0,r.end-r.start+1)*s.a.days*r.alloc,cost=(r,s)=>days(r,s)*r.rate,base=s=>s.rows.reduce((a,r)=>a+cost(r,s),0),allow=s=>base(s)*s.a.allowance/100,total=s=>base(s)+allow(s),head=s=>s.a.target-total(s);
function render(){let s=cur();$('#scenario').innerHTML=state.scenarios.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.name}</option>`).join('');let h=head(s);$('#status').textContent=h>=0?`Within target: ${fmt(h,s.a.currency)} headroom`:`Above target: ${fmt(-h,s.a.currency)}`;$('#status').className='status '+(h<0?'bad':'');$('#kpis').innerHTML=[['Total price',fmt(total(s),s.a.currency),'Including allowance'],['Headroom',fmt(h,s.a.currency),'Against target'],['Person-days',Math.round(s.rows.reduce((a,r)=>a+days(r,s),0)).toLocaleString(),'Across all resources'],['Base cost',fmt(base(s),s.a.currency),`${s.a.allowance}% allowance = ${fmt(allow(s),s.a.currency)}`]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="note">${x[2]}</div></div>`).join('');renderSummary();renderTeam();renderCompare();save()}
function renderSummary(){let s=cur(),tot=base(s),w={};Object.keys(ws).forEach(k=>w[k]=0);s.rows.forEach(r=>w[r.ws]=(w[r.ws]||0)+cost(r,s));$('#summary').innerHTML=`<div class="panel"><h2>Commercial assumptions</h2><div class="inputs">${[['Target price','target',s.a.target],['Allowance %','allowance',s.a.allowance],['Working days / month','days',s.a.days]].map(x=>`<label class="field"><span>${x[0]}</span><input data-a="${x[1]}" type="number" value="${x[2]}"></label>`).join('')}<label class="field"><span>Currency</span><select data-a="currency">${['EUR','USD','AED','SAR','TND'].map(c=>`<option ${c===s.a.currency?'selected':''}>${c}</option>`).join('')}</select></label></div></div><div class="panel"><h2>Cost by workstream</h2><div class="bars">${Object.keys(ws).map(k=>`<div class="brow"><div><b>${k}</b> · ${ws[k]}</div><div class="track"><div class="fill" style="width:${tot?w[k]/tot*100:0}%"></div></div><div class="right">${fmt(w[k],s.a.currency)}</div></div>`).join('')}</div></div>`;document.querySelectorAll('[data-a]').forEach(e=>e.onchange=()=>{s.a[e.dataset.a]=e.dataset.a==='currency'?e.value:+e.value;render()})}
function renderTeam(){let s=cur();$('#team').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><h2>Editable resource model</h2><button id="add" class="accent">Add resource</button></div><div class="table"><table><thead><tr><th>ID</th><th>Role</th><th>Group</th><th>Source</th><th>Start</th><th>End</th><th>Rate/day</th><th>Allocation</th><th>Workstream</th><th class="num">Days</th><th class="num">Cost</th><th></th></tr></thead><tbody>${s.rows.map((r,i)=>`<tr><td><input data-i="${i}" data-k="id" value="${r.id}"></td><td><input class="role" data-i="${i}" data-k="role" value="${r.role}"></td><td><select data-i="${i}" data-k="group"><option ${r.group==='Key Expert'?'selected':''}>Key Expert</option><option ${r.group==='Support Team'?'selected':''}>Support Team</option></select></td><td><select data-i="${i}" data-k="source"><option ${r.source==='Internal'?'selected':''}>Internal</option><option ${r.source==='Freelance'?'selected':''}>Freelance</option></select></td><td><input type="number" data-i="${i}" data-k="start" value="${r.start}"></td><td><input type="number" data-i="${i}" data-k="end" value="${r.end}"></td><td><input type="number" data-i="${i}" data-k="rate" value="${r.rate}"></td><td><input type="number" step=".05" min="0" max="1" data-i="${i}" data-k="alloc" value="${r.alloc}"></td><td><select data-i="${i}" data-k="ws">${Object.keys(ws).map(k=>`<option ${r.ws===k?'selected':''}>${k}</option>`).join('')}</select></td><td class="num">${Math.round(days(r,s))}</td><td class="num">${fmt(cost(r,s),s.a.currency)}</td><td><button data-del="${i}">×</button></td></tr>`).join('')}</tbody></table></div></div>`;document.querySelectorAll('#team [data-k]').forEach(e=>e.onchange=()=>{let r=s.rows[+e.dataset.i],k=e.dataset.k;r[k]=['start','end','rate','alloc'].includes(k)?+e.value:e.value;if(r.end<r.start)r.end=r.start;r.alloc=Math.max(0,Math.min(1,r.alloc));render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{s.rows.splice(+b.dataset.del,1);render()});$('#add').onclick=()=>{s.rows.push({id:'NEW',role:'New resource',group:'Support Team',source:'Internal',start:1,end:12,rate:500,alloc:.5,ws:'WS1'});render()}}
function renderCompare(){let s=cur();$('#compare').innerHTML=`<div class="panel"><h2>Scenario comparison</h2><div class="scenarioCards">${state.scenarios.map(x=>`<div class="sc"><h3>${x.name}</h3><p><span>Total price</span><b>${fmt(total(x),x.a.currency)}</b></p><p><span>Headroom</span><b>${fmt(head(x),x.a.currency)}</b></p><p><span>Person-days</span><b>${Math.round(x.rows.reduce((a,r)=>a+days(r,x),0)).toLocaleString()}</b></p><button data-open="${x.id}">Open</button>${state.scenarios.length>1?` <button data-delete="${x.id}">Delete</button>`:''}</div>`).join('')}</div></div>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.active=b.dataset.open;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.scenarios=state.scenarios.filter(x=>x.id!==b.dataset.delete);if(state.active===b.dataset.delete)state.active=state.scenarios[0].id;render()})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['summary','team','compare'].forEach(x=>$('#'+x).classList.toggle('hide',x!==b.dataset.tab))});$('#scenario').onchange=e=>{state.active=e.target.value;render()};$('#new').onclick=()=>{let n=prompt('Scenario name','New Scenario');if(n){let s=factory(n);state.scenarios.push(s);state.active=s.id;render()}};$('#dup').onclick=()=>{let s=clone(cur());s.id=uid();s.name=prompt('Scenario name',s.name+' Copy')||s.name+' Copy';state.scenarios.push(s);state.active=s.id;render()};$('#reset').onclick=()=>{if(confirm('Reset current scenario?')){let old=cur(),s=factory(old.name);s.id=old.id;state.scenarios=state.scenarios.map(x=>x.id===old.id?s:x);render()}};$('#csv').onclick=()=>{let s=cur(),rows=[['ID','Role','Group','Source','Start','End','Daily Rate','Allocation','Workstream','Person Days','Cost'],...s.rows.map(r=>[r.id,r.role,r.group,r.source,r.start,r.end,r.rate,r.alloc,r.ws,days(r,s),cost(r,s)])],csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='tunisie-telecom-pricing.csv';a.click()};render();
</script></body></html>
